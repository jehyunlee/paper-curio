<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-api-keys"></html:h2></label>
    <description
      data-l10n-id="pref-api-keys-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <hbox align="center">
      <label data-l10n-id="pref-review-provider"></label>
      <html:select preference="extensions.zotero.__addonRef__.REVIEW_PROVIDER">
        <html:option value="anthropic">Anthropic · Sonnet 5</html:option>
        <html:option value="openai">OpenAI · GPT-5</html:option>
        <html:option value="google">Google · Gemini 3.1 Pro</html:option>
      </html:select>
    </hbox>
    <html:details>
      <html:summary data-l10n-id="pref-review-budget"></html:summary>
      <label data-l10n-id="pref-review-budget-hint"></label>
      <html:input
        type="text"
        placeholder="Maximum USD"
        preference="extensions.zotero.__addonRef__.REVIEW_MAX_COST_USD"
      ></html:input>
      <html:input
        type="text"
        placeholder="Input USD / million tokens"
        preference="extensions.zotero.__addonRef__.REVIEW_INPUT_RATE"
      ></html:input>
      <html:input
        type="text"
        placeholder="Output USD / million tokens"
        preference="extensions.zotero.__addonRef__.REVIEW_OUTPUT_RATE"
      ></html:input>
    </html:details>

    <hbox align="center">
      <label
        data-l10n-id="pref-anthropic-key"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        data-credential="ANTHROPIC_API_KEY"
      ></html:input>
    </hbox>
    <html:details>
      <html:summary data-l10n-id="pref-optional-providers"></html:summary>
      <hbox align="center">
        <label
          data-l10n-id="pref-openai-key"
          style="display: flex; align-items: center; min-width: 12em"
        ></label>
        <html:input
          type="password"
          style="flex: 1"
          data-credential="OPENAI_API_KEY"
        ></html:input>
      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="pref-gemini-key"
          style="display: flex; align-items: center; min-width: 12em"
        ></label>
        <html:input
          type="password"
          style="flex: 1"
          data-credential="GEMINI_API_KEY"
        ></html:input>
      </hbox>
    </html:details>
  </groupbox>

  <groupbox>
    <html:details>
      <html:summary data-l10n-id="pref-litdb"></html:summary>
      <description data-l10n-id="pref-litdb-hint"></description>
      <hbox align="center">
        <label
          data-l10n-id="pref-scopus-key"
          style="display: flex; align-items: center; min-width: 12em"
        ></label>
        <html:input
          type="password"
          style="flex: 1"
          data-credential="SCOPUS_API_KEY"
        ></html:input>
      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="pref-scopus-token"
          style="display: flex; align-items: center; min-width: 12em"
        ></label>
        <html:input
          type="password"
          style="flex: 1"
          data-credential="SCOPUS_INST_TOKEN"
        ></html:input>
      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="pref-s2-key"
          style="display: flex; align-items: center; min-width: 12em"
        ></label>
        <html:input
          type="password"
          style="flex: 1"
          data-credential="S2_API_KEY"
        ></html:input>
      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="pref-openalex-email"
          style="display: flex; align-items: center; min-width: 12em"
        ></label>
        <html:input
          type="text"
          style="flex: 1"
          preference="extensions.zotero.__addonRef__.OPENALEX_EMAIL"
        ></html:input>
      </hbox>
      <hbox align="center">
        <label
          data-l10n-id="pref-springer-meta-key"
          style="display: flex; align-items: center; min-width: 12em"
        ></label>
        <html:input
          type="password"
          style="flex: 1"
          data-credential="SPRINGER_META_API_KEY"
        ></html:input>
      </hbox>
    </html:details>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-models"></html:h2></label>
    <hbox align="center">
      <label
        data-l10n-id="pref-anthropic-model"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.ANTHROPIC_MODEL"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-openai-model"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.OPENAI_MODEL"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-gemini-model"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.GEMINI_MODEL"
      ></html:input>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-output"></html:h2></label>
    <description
      data-l10n-id="pref-output-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <description
      id="papercurio-pc-status"
      style="font-size: 11px; font-weight: 600; margin: 2px 0 6px"
    ></description>
    <hbox align="center">
      <label
        data-l10n-id="pref-pc-root"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.PAPER_CURATION_ROOT"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-fallback-dir"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.OUTPUT_FALLBACK_DIR"
      ></html:input>
    </hbox>
    <checkbox
      data-l10n-id="pref-overwrite"
      preference="extensions.zotero.__addonRef__.OVERWRITE_EXISTING"
      native="true"
    />
    <checkbox
      data-l10n-id="pref-compare-image"
      preference="extensions.zotero.__addonRef__.COMPARE_IMAGE"
      native="true"
    />
    <description
      data-l10n-id="pref-compare-image-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <hbox align="center">
      <label
        data-l10n-id="pref-python-path"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.PYTHON_PATH"
      ></html:input>
    </hbox>
    <description
      data-l10n-id="pref-python-path-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <description
      data-l10n-id="pref-overwrite-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-chat"></html:h2></label>
    <hbox align="center">
      <label
        data-l10n-id="pref-chat-lang"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <menulist
        native="true"
        preference="extensions.zotero.__addonRef__.CHAT_LANG"
      >
        <menupopup>
          <menuitem value="ko" label="한국어 (Korean)"></menuitem>
          <menuitem value="en" label="English"></menuitem>
        </menupopup>
      </menulist>
    </hbox>
    <description
      data-l10n-id="pref-chat-lang-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
  </groupbox>
</vbox>
