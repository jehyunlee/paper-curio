<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-llm-backend"></html:h2></label>
    <description
      data-l10n-id="pref-llm-backend-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <hbox align="center">
      <label
        data-l10n-id="pref-llm-backend-select"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <menulist
        native="true"
        preference="extensions.zotero.__addonRef__.LLM_BACKEND"
      >
        <menupopup>
          <menuitem value="api" data-l10n-id="pref-backend-api"></menuitem>
          <menuitem
            value="claude-cli"
            data-l10n-id="pref-backend-claude"
          ></menuitem>
          <menuitem
            value="codex-cli"
            data-l10n-id="pref-backend-codex"
          ></menuitem>
        </menupopup>
      </menulist>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-claude-cli-path"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.CLAUDE_CLI_PATH"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-codex-cli-path"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.CODEX_CLI_PATH"
      ></html:input>
    </hbox>
    <description
      data-l10n-id="pref-cli-path-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-api-keys"></html:h2></label>
    <description
      data-l10n-id="pref-api-keys-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>

    <hbox align="center">
      <label
        data-l10n-id="pref-anthropic-key"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.ANTHROPIC_API_KEY"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-openai-key"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.OPENAI_API_KEY"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-gemini-key"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.GEMINI_API_KEY"
      ></html:input>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-litdb"></html:h2></label>
    <description data-l10n-id="pref-litdb-hint"></description>
    <hbox align="center">
      <label
        data-l10n-id="pref-scopus-key"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.SCOPUS_API_KEY"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-scopus-token"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.SCOPUS_INST_TOKEN"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-s2-key"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.S2_API_KEY"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-openalex-email"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.OPENALEX_EMAIL"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-springer-meta-key"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="password"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.SPRINGER_META_API_KEY"
      ></html:input>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-models"></html:h2></label>
    <hbox align="center">
      <label
        data-l10n-id="pref-anthropic-model"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.ANTHROPIC_MODEL"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-openai-model"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.OPENAI_MODEL"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-gemini-model"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.GEMINI_MODEL"
      ></html:input>
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h2 data-l10n-id="pref-output"></html:h2></label>
    <description
      data-l10n-id="pref-output-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <description
      id="papercurio-pc-status"
      style="font-size: 11px; font-weight: 600; margin: 2px 0 6px"
    ></description>
    <hbox align="center">
      <label
        data-l10n-id="pref-pc-root"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.PAPER_CURATION_ROOT"
      ></html:input>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-fallback-dir"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.OUTPUT_FALLBACK_DIR"
      ></html:input>
    </hbox>
    <checkbox
      data-l10n-id="pref-overwrite"
      preference="extensions.zotero.__addonRef__.OVERWRITE_EXISTING"
      native="true"
    />
    <checkbox
      data-l10n-id="pref-compare-image"
      preference="extensions.zotero.__addonRef__.COMPARE_IMAGE"
      native="true"
    />
    <description
      data-l10n-id="pref-compare-image-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <hbox align="center">
      <label
        data-l10n-id="pref-python-path"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <html:input
        type="text"
        style="flex: 1"
        preference="extensions.zotero.__addonRef__.PYTHON_PATH"
      ></html:input>
    </hbox>
    <description
      data-l10n-id="pref-python-path-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
    <description
      data-l10n-id="pref-overwrite-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-chat"></html:h2></label>
    <hbox align="center">
      <label
        data-l10n-id="pref-chat-lang"
        style="display: flex; align-items: center; min-width: 12em"
      ></label>
      <menulist
        native="true"
        preference="extensions.zotero.__addonRef__.CHAT_LANG"
      >
        <menupopup>
          <menuitem value="ko" label="한국어 (Korean)"></menuitem>
          <menuitem value="en" label="English"></menuitem>
        </menupopup>
      </menulist>
    </hbox>
    <description
      data-l10n-id="pref-chat-lang-hint"
      style="opacity: 0.7; font-size: 11px"
    ></description>
  </groupbox>
</vbox>
